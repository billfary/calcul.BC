<!doctype html><html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Calcul BC</title><link rel="icon" href="./ICONE.png?v=19"><link rel="apple-touch-icon" sizes="180x180" href="./ICONE.png?v=19"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Calcul BC"><style>
:root{--g:#44a536;--gd:#23752a;--gl:#d3e9cc;--r:#c91d18;--bg:#f3f5f7;--o:#ed8b12;--bl:#2367d1}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg)}body{position:fixed;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:#111}.app{max-width:430px;height:100dvh;margin:auto;padding:9px 11px;display:grid;grid-template-rows:auto auto auto 1fr auto;gap:7px}.top{display:flex;justify-content:space-between;font-weight:950}.title{font-size:20px}.delta{font-size:18px}.cards,.totals{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card,.total{min-height:112px;border-radius:22px;padding:10px;text-align:center}.output,.total{background:var(--gd);border:6px solid var(--r)}.info{background:var(--gl);border:3px solid var(--gd)}.lab{font-size:17px;font-weight:950}.value{display:flex;justify-content:center;align-items:baseline;margin-top:11px}.val{font-size:46px;font-weight:950;color:var(--r)}.info .val{color:#111}.unit{font-size:14px;font-weight:950;margin-left:5px}.percase{text-align:center;font-weight:950}.totals{display:none}.totals.show{display:grid}.error{display:none;background:#fff;border:4px solid var(--r);border-radius:21px;padding:11px;text-align:center;box-shadow:0 7px 18px #0002}.error.show{display:block}.error.solved .error-main,.error.solved .error-billal,.error.solved .error-label,.error.solved .error-weight{display:none}.error.solved .override{border-top:0;margin-top:0;padding-top:4px}.error-main,.error-billal{font-size:25px;font-weight:950;color:var(--r);line-height:1.02;letter-spacing:-.5px;white-space:nowrap}.error-billal{margin-top:8px}.error-main{margin-left:-5px;margin-right:-5px}.error-label{font-size:14px;font-weight:950;margin-top:10px}.error-weight{font-size:22px;font-weight:950;margin-top:4px}.warning-zone{display:none;justify-content:center;margin-top:8px}.warning-zone.show{display:flex}.warn-btn{border:0;background:transparent;width:210px;display:flex;flex-direction:column;align-items:center}.warning-icon{width:170px;height:148px;position:relative;filter:drop-shadow(0 7px 7px #0003)}.warning-icon:before,.warning-icon:after{position:absolute;content:"";clip-path:polygon(50% 0,100% 100%,0 100%)}.warning-icon:before{inset:0;background:#111}.warning-icon:after{content:"!";left:8px;right:8px;top:9px;bottom:8px;background:#f6c900;display:flex;align-items:flex-end;justify-content:center;padding-bottom:14px;font-size:70px;font-weight:950}.warn-cap{font-size:18px;font-weight:950;margin-top:-2px}.override{display:none;border-top:2px solid #ddd;margin-top:10px;padding-top:12px}.override.show{display:block}.override h3{font-size:21px;line-height:1.05;color:var(--r);margin:3px -8px 18px}.solution-weight{font-size:43px;font-weight:950;color:var(--r)}.solution-case{font-size:27px;font-weight:950;margin-top:10px}.solution-label{font-size:16px;font-weight:950;margin-top:25px}.solution-percent,.solution-kg{font-size:37px;font-weight:950;color:var(--r);margin-top:6px}.solution-gap{margin-top:34px}.solution-kg{padding-bottom:12px}.spacer{min-height:0}.controls{align-self:end}.selector{background:#fff;border:2px solid var(--g);border-radius:20px;padding:8px}.selector-head{display:flex;justify-content:space-between;font-weight:950;margin-bottom:7px}.net{font-size:19px}.options{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.option{border:4px solid transparent;border-radius:16px;min-height:55px;color:#fff;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center}.option.selected{border-color:#000;color:#000}.wood{background:var(--o)}.plastic{background:var(--bl)}.pallet{background:var(--g)}.none{background:var(--r)}.name{font-size:9px;text-align:center}.ow{font-size:11px}.inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px}.input-card{background:#fff;border:3px solid var(--g);border-radius:18px;padding:6px}.input-card label{display:block;text-align:center;font-size:10px;font-weight:950}.iw{display:flex;align-items:baseline}.input-card input{width:75%;border:0;outline:0;text-align:center;font-size:27px;font-weight:950}.iu{font-size:11px;font-weight:950}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:10;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modal-box{background:#fff;border:4px solid #111;border-radius:22px;padding:20px;width:min(340px,100%);text-align:center}.modal-title{font-size:20px;font-weight:950}.modal-input{width:100%;height:52px;border:3px solid var(--g);border-radius:14px;text-align:center;font-size:26px;font-weight:950;margin-top:14px}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.modal-btn{height:44px;border:0;border-radius:12px;font-weight:950}.ok{background:var(--g);color:#fff}.bad{color:var(--r);min-height:18px;margin-top:7px;font-weight:900}
@media(max-width:365px){.error-main,.error-billal{font-size:22px}}
</style></head><body><main class="app"><header class="top"><div class="title">CALCUL BC</div><div id="delta" class="delta">—</div></header><section class="cards"><article id="cc" class="card output"><div id="cl" class="lab">CAISSE</div><div class="value"><strong id="cv" class="val">—</strong><span class="unit">ca</span></div></article><article id="wc" class="card output"><div id="wl" class="lab">POIDS</div><div class="value"><strong id="wv" class="val">—</strong><span class="unit">kg</span></div></article></section><div class="percase"><span id="pc">—</span> kg / caisse</div><section id="totals" class="totals"><article class="total"><div class="lab">TOTAL CAISSE</div><div class="value"><strong id="tc" class="val">—</strong><span class="unit">ca</span></div></article><article class="total"><div class="lab">TOTAL POIDS</div><div class="value"><strong id="tw" class="val">—</strong><span class="unit">kg</span></div></article></section><div id="error" class="error"><div class="error-main">ERREUR CALCUL</div><div class="error-billal">VOIR BILLAL</div><div class="error-label">POIDS CAISSE RÉEL</div><div id="ed" class="error-weight"></div><div id="wz" class="warning-zone"><button id="warn" class="warn-btn"><span class="warning-icon"></span><span class="warn-cap">ATTENTION</span></button></div><div id="over" class="override"><h3>SOLUTION HORS LIMITE DE 5 %</h3><div id="ow" class="solution-weight"></div><div id="oc" class="solution-case"></div><div class="solution-label">ÉCART MINIMAL</div><div id="op" class="solution-percent"></div><div class="solution-label solution-gap">CORRESPONDANCE POIDS</div><div id="okg" class="solution-kg"></div></div></div><div class="spacer"></div><section class="controls"><div class="selector"><div class="selector-head"><div>INCLUS DANS LA PESÉE</div><div id="net" class="net">— kg</div></div><div class="options"><button class="option wood" data-t="75">▦<span class="name">TOTE BOIS</span><span class="ow">75 kg</span></button><button class="option plastic" data-t="50">▣<span class="name">TOTE PLASTIQUE</span><span class="ow">50 kg</span></button><button class="option pallet" data-t="30">▤<span class="name">PALETTE</span><span class="ow">30 kg</span></button><button class="option none selected" data-t="0">⊘<span class="name">RIEN</span><span class="ow">0 kg</span></button></div></div><div class="inputs"><div class="input-card"><label>NB PALETTES</label><div class="iw"><input id="p" type="number" value="1"><span class="iu">pal</span></div></div><div class="input-card"><label>NB CAISSES</label><div class="iw"><input id="n" type="number" placeholder="0"><span class="iu">ca</span></div></div><div class="input-card"><label>POIDS PESÉ</label><div class="iw"><input id="g" type="number" placeholder="0"><span class="iu">kg</span></div></div></div></section></main><div id="modal" class="modal"><div class="modal-box"><div class="modal-title">ACCÈS BILLAL</div><input id="pwd" class="modal-input" type="password"><div id="bad" class="bad"></div><div class="modal-actions"><button id="cancel" class="modal-btn">ANNULER</button><button id="valid" class="modal-btn ok">VALIDER</button></div></div></div><script>
const $=x=>document.getElementById(x),fmt=(v,d)=>Number(v).toLocaleString('fr-CA',{minimumFractionDigits:d,maximumFractionDigits:d});let tare=0,last=null;function ex(w,n,d){return Number.isInteger(w*10**d/n)}function solve(net,n,limit=true){let lo=1,hi=Math.ceil(net+10000);if(limit){lo=Math.max(1,Math.ceil(net*.95));hi=Math.floor(net*1.05)}let a=[];for(let w=lo;w<=hi;w++){let d=ex(w,n,0)?0:ex(w,n,1)?1:ex(w,n,2)?2:null;if(d!==null)a.push({w,d,z:Math.abs(w-net)})}a.sort((x,y)=>limit?(x.d-y.d||x.z-y.z):(x.z-y.z||x.d-y.d));return a[0]||null}function resetIssue(){$('error').classList.remove('show','solved');$('wz').classList.remove('show');$('over').classList.remove('show');last=null}function clear(){['cv','wv','pc','tc','tw'].forEach(x=>$(x).textContent='—');$('delta').textContent='—'}function calc(){resetIssue();let p=Math.max(1,+$('p').value||1),n=+$('n').value,g=+$('g').value,m=p>1;$('totals').classList.toggle('show',m);$('cc').className='card '+(m?'info':'output');$('wc').className='card '+(m?'info':'output');$('cl').textContent=m?'CAISSE / PALETTE':'CAISSE';$('wl').textContent=m?'POIDS / PALETTE':'POIDS';$('net').textContent=g>tare?fmt(g-tare,1)+' kg':'— kg';if(!(n>0&&g>0)){clear();return}let net=g-tare,r=solve(net,n,true);if(!r){clear();last={net,n};$('ed').textContent=fmt(net/n,5)+' kg/caisse';$('error').classList.add('show');$('wz').classList.add('show');return}$('cv').textContent=n;$('wv').textContent=r.w;$('pc').textContent=fmt(r.w/n,r.d);$('tc').textContent=n*p;$('tw').textContent=r.w*p;let d=r.w-net,q=d/net*100;$('delta').textContent=(q>=0?'+':'−')+fmt(Math.abs(q),1)+' % ('+(d>=0?'+':'−')+Math.round(Math.abs(d))+' kg)'}$('warn').onclick=()=>{$('modal').classList.add('show');$('pwd').value='';$('bad').textContent='';$('pwd').focus()};$('cancel').onclick=()=>$('modal').classList.remove('show');$('valid').onclick=()=>{if($('pwd').value.toUpperCase()!=='BF'){$('bad').textContent='Mot de passe incorrect';return}$('modal').classList.remove('show');let r=solve(last.net,last.n,false),d=r.w-last.net,q=d/last.net*100;$('ow').textContent=r.w+' kg';$('oc').textContent=fmt(r.w/last.n,r.d)+' kg/caisse';$('op').textContent=(q>=0?'+':'−')+fmt(Math.abs(q),2)+' %';$('okg').textContent=Math.round(Math.abs(d))+' kg';$('wz').classList.remove('show');$('error').classList.add('solved');$('over').classList.add('show')};document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');tare=+b.dataset.t;calc()});['p','n','g'].forEach(x=>$(x).oninput=calc);
</script></body></html>
