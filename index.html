<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Calcul BC</title>

  <!-- Icônes du site et de l’écran d’accueil iPhone -->
  <link rel="icon" type="image/png" href="./ICONE.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="./ICONE.png?v=2">
  <link rel="apple-touch-icon-precomposed" href="./ICONE.png?v=2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Calcul BC">
  <meta name="application-name" content="Calcul BC">
  <meta name="theme-color" content="#eef2f6">

  <style>
    :root{
      --navy:#071a35;--red:#c8231a;--red-dark:#9e120d;
      --green:#55ad2a;--blue:#1d63d5;--orange:#e78b18;
      --bg:#eef2f6;--card:#fff;--muted:#67758a;--line:#d8e0e9;
      --shadow:0 12px 30px rgba(7,26,53,.14);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
    body{position:fixed;inset:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--navy);touch-action:manipulation}
    button,input{font:inherit}

    .app{
      width:100%;max-width:430px;height:100dvh;margin:0 auto;
      padding:max(12px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));
      display:grid;grid-template-rows:auto 1fr auto;gap:12px;overflow:hidden;
    }

    .hero{
      background:linear-gradient(145deg,var(--red),var(--red-dark));color:#fff;
      border-radius:28px;padding:18px 19px;box-shadow:var(--shadow);position:relative;overflow:hidden;
    }
    .hero:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.07);right:-65px;bottom:-108px}
    .hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:relative;z-index:1}
    .hero-title{font-size:20px;font-weight:950;letter-spacing:.6px}
    .delta{text-align:right;font-weight:950;min-width:92px}
    .delta div{font-size:23px;line-height:1}.delta div+div{margin-top:8px}
    .bc-row{display:flex;align-items:baseline;justify-content:center;margin:18px 0 9px;position:relative;z-index:1}
    .bc-value{font-size:61px;font-weight:950;line-height:.9;letter-spacing:-2px}.bc-unit{font-size:21px;font-weight:900;margin-left:7px}
    .per-case{text-align:center;font-size:17px;font-weight:850;position:relative;z-index:1}.per-case strong{font-size:24px}
    .hero.empty .bc-value,.hero.empty .bc-unit,.hero.empty .per-case{opacity:.42}

    .space{min-height:0}

    .controls{display:flex;flex-direction:column;gap:11px;align-self:end}
    .selector{background:var(--card);border-radius:22px;padding:11px 12px;box-shadow:0 7px 20px rgba(7,26,53,.08)}
    .selector-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
    .selector-title{font-size:14px;font-weight:950}
    .net-live{font-size:21px;line-height:1;font-weight:950;text-align:right;min-width:88px}
    .net-none{color:var(--red)}.net-pallet{color:var(--green)}.net-plastic{color:var(--blue)}.net-wood{color:var(--orange)}
    .options{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
    .option{border:0;border-radius:18px;min-height:70px;padding:6px 3px;color:#fff;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
    .option:active{transform:scale(.96)}.option.selected{outline:4px solid var(--navy);outline-offset:2px}
    .wood{background:var(--orange)}.plastic{background:var(--blue)}.pallet{background:var(--green)}.none{background:var(--red)}
    .icon{font-size:22px;line-height:1}.option-name{font-size:9px;line-height:1.05;text-align:center}.option-weight{font-size:12px}
    .forbidden{width:27px;height:27px;border:3px solid #fff;border-radius:50%;position:relative}
    .forbidden:after{content:"";position:absolute;width:25px;height:3px;background:#fff;border-radius:2px;left:-2px;top:9px;transform:rotate(-45deg)}

    .inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .input-card{background:#fff;border:2px solid var(--line);border-radius:21px;padding:10px 13px;box-shadow:0 5px 16px rgba(7,26,53,.06)}
    .input-card:focus-within{border-color:var(--navy);box-shadow:0 0 0 3px rgba(7,26,53,.09)}
    label{display:block;font-size:11px;font-weight:900;letter-spacing:.6px;color:var(--muted)}
    .input-wrap{display:flex;align-items:baseline}.input-card input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--navy);font-size:34px;font-weight:950;text-align:center;padding:3px 0}
    .input-unit{font-size:14px;font-weight:900;color:var(--muted);margin-left:4px}

    @media(max-height:700px){
      .app{gap:8px;padding-top:max(8px,env(safe-area-inset-top));padding-bottom:max(8px,env(safe-area-inset-bottom))}
      .hero{padding:14px 17px}.bc-row{margin:12px 0 6px}.bc-value{font-size:52px}.delta div{font-size:20px}
      .controls{gap:8px}.selector{padding:9px 10px}.option{min-height:62px}.input-card{padding:8px 11px}.input-card input{font-size:30px}
    }
    @media(max-width:365px){.app{padding-left:9px;padding-right:9px}.options,.inputs{gap:7px}.bc-value{font-size:52px}.net-live{font-size:19px}}
  </style>
</head>
<body>
  <main class="app">
    <section id="hero" class="hero empty" aria-live="polite">
      <div class="hero-top">
        <div class="hero-title">CALCUL BC</div>
        <div class="delta"><div id="deltaPct">—</div><div id="deltaKg">—</div></div>
      </div>
      <div class="bc-row"><span id="bcValue" class="bc-value">—</span><span class="bc-unit">kg</span></div>
      <div class="per-case"><strong id="caseWeight">—</strong> kg / caisse</div>
    </section>

    <div class="space"></div>

    <section class="controls">
      <div class="selector">
        <div class="selector-head">
          <div class="selector-title">Inclus dans la pesée</div>
          <div id="netLive" class="net-live net-none">— kg</div>
        </div>
        <div class="options">
          <button class="option wood" data-tare="75" data-class="net-wood" aria-label="Tote en bois, retirer 75 kilogrammes"><span class="icon">▦</span><span class="option-name">TOTE<br>BOIS</span><span class="option-weight">75 kg</span></button>
          <button class="option plastic" data-tare="50" data-class="net-plastic" aria-label="Tote en plastique, retirer 50 kilogrammes"><span class="icon">▣</span><span class="option-name">TOTE<br>PLASTIQUE</span><span class="option-weight">50 kg</span></button>
          <button class="option pallet" data-tare="30" data-class="net-pallet" aria-label="Palette en bois, retirer 30 kilogrammes"><span class="icon">▤</span><span class="option-name">PALETTE</span><span class="option-weight">30 kg</span></button>
          <button class="option none selected" data-tare="0" data-class="net-none" aria-label="Rien à retirer"><span class="forbidden"></span><span class="option-name">RIEN</span><span class="option-weight">0 kg</span></button>
        </div>
      </div>

      <div class="inputs">
        <div class="input-card">
          <label for="cases">NB CAISSES</label>
          <div class="input-wrap"><input id="cases" type="number" inputmode="numeric" min="1" max="250" placeholder="0"><span class="input-unit">ca</span></div>
        </div>
        <div class="input-card">
          <label for="weight">POIDS PESÉ</label>
          <div class="input-wrap"><input id="weight" type="number" inputmode="decimal" min="0" max="1600" placeholder="0"><span class="input-unit">kg</span></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const $=id=>document.getElementById(id);
    const casesEl=$('cases'),weightEl=$('weight'),hero=$('hero'),bcValue=$('bcValue'),caseWeight=$('caseWeight'),deltaPct=$('deltaPct'),deltaKg=$('deltaKg'),netLive=$('netLive');
    let tare=0,netClass='net-none';
    const fmt=(v,d)=>Number(v).toLocaleString('fr-CA',{minimumFractionDigits:d,maximumFractionDigits:d});
    function exactAt(w,n,d){return Number.isInteger((w*(10**d))/n)}
    function solve(net,n){
      const limit=net*.05,low=Math.max(1,Math.ceil(net-limit)),high=Math.floor(net+limit),groups=[[],[],[]];
      for(let w=low;w<=high;w++){const d=exactAt(w,n,0)?0:exactAt(w,n,1)?1:2;groups[d].push({w,d,diff:Math.abs(w-net)})}
      const pool=groups[0].length?groups[0]:groups[1].length?groups[1]:groups[2];
      pool.sort((a,b)=>a.diff-b.diff||a.w-b.w);return pool[0]||null;
    }
    function updateNet(gross){
      netLive.className='net-live '+netClass;
      netLive.textContent=Number.isFinite(gross)&&gross>tare?fmt(gross-tare,1)+' kg':'— kg';
    }
    function clear(){
      hero.classList.add('empty');bcValue.textContent='—';caseWeight.textContent='—';deltaPct.textContent='—';deltaKg.textContent='—';updateNet(parseFloat(weightEl.value));
    }
    function calculate(){
      const n=parseInt(casesEl.value,10),gross=parseFloat(weightEl.value);updateNet(gross);
      if(!(n>0&&gross>0)){clear();return}
      const net=gross-tare;if(net<=0){clear();return}
      const r=solve(net,n);if(!r){clear();return}
      const diff=r.w-net,pct=diff/net*100;
      hero.classList.remove('empty');bcValue.textContent=r.w;caseWeight.textContent=fmt(r.w/n,r.d);
      deltaPct.textContent=(pct>=0?'+':'−')+fmt(Math.abs(pct),1)+' %';
      deltaKg.textContent=(diff>=0?'+':'−')+Math.round(Math.abs(diff))+' kg';
    }
    document.querySelectorAll('.option').forEach(btn=>btn.addEventListener('click',()=>{
      document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');
      tare=Number(btn.dataset.tare);netClass=btn.dataset.class;calculate();
    }));
    casesEl.addEventListener('input',calculate);weightEl.addEventListener('input',calculate);
    document.addEventListener('touchmove',e=>{if(e.scale!==1)e.preventDefault()},{passive:false});
  </script>
</body>
</html>
